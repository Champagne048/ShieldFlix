name: Smoke test (Android TV emulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R ${{ github.repository }} --pattern ShieldFlix.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out || true
          echo "::notice title=pid::start=$(cat out/pid-start.txt 2>/dev/null) end=$(cat out/pid-end.txt 2>/dev/null)"
          echo "::notice title=crash::$(head -c 1500 out/crash.txt 2>/dev/null | tr '\n' ' ')"
          zip -qr smoke-results.zip out
          gh release create "smoke-${{ github.run_number }}" smoke-results.zip --prerelease --title "Smoke test ${{ github.run_number }}" --notes "Kết quả chạy thử trên máy ảo"
